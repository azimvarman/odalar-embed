<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odalar — İlgi Alanına Göre Shorts</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1e26;
    --card-hover: #232937;
    --text: #e8eaf0;
    --muted: #8a92a6;
    --accent: #6c8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------- Odalar ekranı ---------- */
  #roomsScreen {
    height: 100dvh;
    overflow-y: auto;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    max-width: 900px;
    margin: 0 auto;
  }
  .header { margin-bottom: 6px; font-size: 28px; font-weight: 700; }
  .subheader { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .room-card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px 16px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, transform .1s;
    position: relative;
  }
  .room-card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .room-card .emoji { font-size: 34px; margin-bottom: 10px; }
  .room-card .name { font-weight: 600; font-size: 16px; }
  .room-card .queries { color: var(--muted); font-size: 12px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-card .edit-btn {
    position: absolute; top: 10px; right: 10px;
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; padding: 4px; border-radius: 6px;
    opacity: 0; transition: opacity .15s;
  }
  .room-card:hover .edit-btn { opacity: 1; }
  .room-card .edit-btn:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .room-card.add {
    border: 2px dashed #333b4d;
    background: transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); min-height: 130px;
  }
  .room-card.add:hover { color: var(--text); border-color: var(--accent); }
  .room-card.add .plus { font-size: 30px; margin-bottom: 6px; }

  /* ---------- Akış ekranı ---------- */
  #feedScreen {
    display: none;
    height: 100dvh;
    position: relative;
    background: #000;
  }
  #feedScreen.active { display: block; }
  #feed {
    height: 100dvh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  .short {
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .short .frame-holder {
    /* Shorts 9:16 — yüksekliğe göre en hesapla, ekrana sığdır */
    height: 100%;
    aspect-ratio: 9 / 16;
    max-width: 100vw;
    background: #000;
    position: relative;
  }
  .short iframe {
    width: 100%; height: 100%;
    border: 0;
  }
  .short .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  .feed-topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    background: linear-gradient(rgba(0,0,0,.65), transparent);
    pointer-events: none;
  }
  .feed-topbar > * { pointer-events: auto; }
  .icon-btn {
    background: rgba(255,255,255,.12);
    border: none;
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .icon-btn:hover { background: rgba(255,255,255,.22); }
  .feed-title { font-weight: 600; font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .feed-counter {
    margin-left: auto;
    font-size: 13px;
    color: rgba(255,255,255,.75);
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .feed-status {
    height: 100dvh;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center;
    color: var(--muted);
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid #2a3040;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Oda düzenleme modalı ---------- */
  #modalOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #modalOverlay.active { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .modal input, .modal textarea {
    width: 100%;
    background: #11141a;
    border: 1px solid #2a3040;
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal textarea { resize: vertical; min-height: 90px; }
  .modal .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .modal .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid #2a3040; }
  .btn.ghost:hover { color: var(--text); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid #4a2a2a; flex: 0 0 auto; padding: 11px 14px; }
  .btn.danger:hover { background: rgba(255,107,107,.1); }
</style>
</head>
<body>

<!-- Odalar ekranı -->
<div id="roomsScreen">
  <div class="header">🚪 Odalar</div>
  <div class="subheader">Bir oda seç, o konudaki Shorts akışına dal. Boş kaydırma yok, hedefli kaydırma var.</div>
  <div class="grid" id="roomsGrid"></div>
</div>

<!-- Akış ekranı -->
<div id="feedScreen">
  <div class="feed-topbar">
    <button class="icon-btn" id="backBtn" title="Odalara dön">←</button>
    <span class="feed-title" id="feedTitle"></span>
    <span class="feed-counter" id="feedCounter"></span>
    <button class="icon-btn" id="refreshBtn" title="Yeni videolar getir">⟳</button>
  </div>
  <div id="feed"></div>
</div>

<!-- Oda ekleme/düzenleme -->
<div id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Yeni Oda</h2>
    <label>Emoji</label>
    <input id="mEmoji" maxlength="4" placeholder="🎯">
    <label>Oda adı</label>
    <input id="mName" placeholder="Örn: İngilizce">
    <label>Arama konuları (her satıra bir tane)</label>
    <textarea id="mQueries" placeholder="ingilizce öğrenme&#10;english vocabulary&#10;günlük ingilizce konuşma"></textarea>
    <div class="hint">Videolar bu konularda aranır. Birden fazla konu = daha çeşitli akış.</div>
    <div class="actions">
      <button class="btn danger" id="mDelete" style="display:none">Sil</button>
      <button class="btn ghost" id="mCancel">Vazgeç</button>
      <button class="btn primary" id="mSave">Kaydet</button>
    </div>
  </div>
</div>

<script src="search.js"></script>
<script>
// Native'de video bu aracı sayfa üzerinden oynar (embed/index.html'in
// yayınlanmış hali). Barındırma adresi değişirse sadece burayı güncelle.
const EMBED_PROXY = "https://azimvarman.github.io/odalar-embed/";

const DEFAULT_ROOMS = [
  { emoji: "🗣️", name: "İngilizce", queries: ["ingilizce öğrenme", "english vocabulary lesson", "günlük ingilizce konuşma kalıpları"] },
  { emoji: "💻", name: "Yazılım", queries: ["yazılım öğrenme ipuçları", "programming tips", "coding tutorial"] },
  { emoji: "🧠", name: "Kişisel Gelişim", queries: ["kişisel gelişim tavsiyeleri", "verimlilik alışkanlıkları", "productivity habits"] },
  { emoji: "💪", name: "Spor & Sağlık", queries: ["evde egzersiz hareketleri", "sağlıklı beslenme ipuçları", "fitness form tips"] },
  { emoji: "🔬", name: "Bilim", queries: ["ilginç bilim gerçekleri", "science facts", "uzay hakkında bilgiler"] },
  { emoji: "💰", name: "Finans", queries: ["finansal okuryazarlık", "para biriktirme ipuçları", "yatırım temelleri"] },
];

let rooms = loadRooms();
let editingIndex = null;   // null = yeni oda ekleniyor
let currentRoom = null;
let observer = null;

function loadRooms() {
  try {
    const saved = JSON.parse(localStorage.getItem("rooms"));
    if (Array.isArray(saved) && saved.length) return saved;
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_ROOMS));
}
function saveRooms() { localStorage.setItem("rooms", JSON.stringify(rooms)); }

/* ---------- Odalar ekranı ---------- */
function renderRooms() {
  const grid = document.getElementById("roomsGrid");
  grid.innerHTML = "";
  rooms.forEach((room, i) => {
    const card = document.createElement("div");
    card.className = "room-card";
    card.innerHTML = `
      <button class="edit-btn" title="Düzenle">✏️</button>
      <div class="emoji">${room.emoji}</div>
      <div class="name">${escapeHtml(room.name)}</div>
      <div class="queries">${escapeHtml(room.queries.join(" · "))}</div>`;
    card.querySelector(".edit-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      openModal(i);
    });
    card.addEventListener("click", () => openRoom(room));
    grid.appendChild(card);
  });
  const add = document.createElement("div");
  add.className = "room-card add";
  add.innerHTML = `<div class="plus">＋</div><div>Yeni oda</div>`;
  add.addEventListener("click", () => openModal(null));
  grid.appendChild(add);
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------- Modal ---------- */
function openModal(index) {
  editingIndex = index;
  const room = index !== null ? rooms[index] : null;
  document.getElementById("modalTitle").textContent = room ? "Odayı Düzenle" : "Yeni Oda";
  document.getElementById("mEmoji").value = room ? room.emoji : "";
  document.getElementById("mName").value = room ? room.name : "";
  document.getElementById("mQueries").value = room ? room.queries.join("\n") : "";
  document.getElementById("mDelete").style.display = room ? "block" : "none";
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal() { document.getElementById("modalOverlay").classList.remove("active"); }

document.getElementById("mCancel").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.getElementById("mSave").addEventListener("click", () => {
  const name = document.getElementById("mName").value.trim();
  const emoji = document.getElementById("mEmoji").value.trim() || "🎯";
  const queries = document.getElementById("mQueries").value
    .split("\n").map((s) => s.trim()).filter(Boolean);
  if (!name || queries.length === 0) {
    alert("Oda adı ve en az bir arama konusu gerekli.");
    return;
  }
  const room = { emoji, name, queries };
  if (editingIndex !== null) rooms[editingIndex] = room;
  else rooms.push(room);
  saveRooms();
  renderRooms();
  closeModal();
});
document.getElementById("mDelete").addEventListener("click", () => {
  if (editingIndex !== null && confirm("Bu oda silinsin mi?")) {
    rooms.splice(editingIndex, 1);
    saveRooms();
    renderRooms();
    closeModal();
  }
});

/* ---------- Akış ---------- */
async function openRoom(room) {
  currentRoom = room;
  document.getElementById("roomsScreen").style.display = "none";
  document.getElementById("feedScreen").classList.add("active");
  document.getElementById("feedTitle").textContent = room.emoji + " " + room.name;
  document.getElementById("feedCounter").textContent = "";

  const feed = document.getElementById("feed");
  feed.innerHTML = `<div class="feed-status"><div class="spinner"></div><div>Videolar getiriliyor…</div></div>`;

  try {
    const results = await Promise.allSettled(
      room.queries.map((q) => window.searchShorts(q))
    );
    // Sorgu sonuçlarını sırayla harmanla (1. sorgudan bir video, 2.'den bir video…)
    const lists = results
      .filter((r) => r.status === "fulfilled" && Array.isArray(r.value))
      .map((r) => shuffle(r.value.slice()));
    const merged = [];
    const seen = new Set();
    let added = true;
    while (added) {
      added = false;
      for (const list of lists) {
        const v = list.shift();
        if (v && !seen.has(v.id)) {
          seen.add(v.id);
          merged.push(v);
          added = true;
        }
      }
    }

    if (merged.length === 0) {
      feed.innerHTML = `<div class="feed-status"><div>😕 Bu konuda video bulunamadı.</div><div style="font-size:13px">Odanın arama konularını düzenlemeyi dene.</div></div>`;
      return;
    }
    renderFeed(merged.slice(0, 60));
  } catch (e) {
    feed.innerHTML = `<div class="feed-status"><div>Bir hata oluştu: ${escapeHtml(String(e))}</div></div>`;
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderFeed(videos) {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  feed.scrollTop = 0;
  if (observer) observer.disconnect();

  videos.forEach((v, i) => {
    const section = document.createElement("div");
    section.className = "short";
    section.dataset.videoId = v.id;
    section.dataset.index = i;
    section.innerHTML = `<div class="frame-holder"><div class="placeholder">▶ ${escapeHtml(v.title || "Yükleniyor…")}</div></div>`;
    feed.appendChild(section);
  });

  const total = videos.length;
  // Görünen video: iframe'i autoplay ile yükle. Görünmeyen: iframe'i kaldır (tek video oynar).
  observer = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        const holder = entry.target.querySelector(".frame-holder");
        if (entry.isIntersecting) {
          document.getElementById("feedCounter").textContent =
            (Number(entry.target.dataset.index) + 1) + " / " + total;
          if (!holder.querySelector("iframe")) {
            const id = entry.target.dataset.videoId;
            const iframe = document.createElement("iframe");
            // Native'de YouTube embed'i doğrudan yüklenemez (Referer yok →
            // hata 153); gerçek https origin'li aracı sayfa üzerinden gider.
            const isNative = typeof window.Capacitor !== "undefined" &&
              window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
            iframe.src = isNative
              ? EMBED_PROXY + "?v=" + id
              : "https://www.youtube-nocookie.com/embed/" + id +
                "?autoplay=1&playsinline=1&rel=0&modestbranding=1&loop=1&playlist=" + id;
            iframe.allow = "autoplay; encrypted-media; picture-in-picture";
            iframe.allowFullscreen = true;
            holder.appendChild(iframe);
          }
        } else {
          const iframe = holder.querySelector("iframe");
          if (iframe) iframe.remove();
        }
      }
    },
    { root: feed, threshold: 0.6 }
  );
  feed.querySelectorAll(".short").forEach((s) => observer.observe(s));
}

document.getElementById("backBtn").addEventListener("click", () => {
  if (observer) observer.disconnect();
  document.getElementById("feed").innerHTML = "";
  document.getElementById("feedScreen").classList.remove("active");
  document.getElementById("roomsScreen").style.display = "block";
});
document.getElementById("refreshBtn").addEventListener("click", () => {
  if (currentRoom) openRoom(currentRoom);
});

// Klavye: ok tuşlarıyla video değiştir
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("feedScreen").classList.contains("active")) return;
  const feed = document.getElementById("feed");
  const h = feed.clientHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown") {
    feed.scrollBy({ top: h, behavior: "smooth" });
    e.preventDefault();
  } else if (e.key === "ArrowUp" || e.key === "PageUp") {
    feed.scrollBy({ top: -h, behavior: "smooth" });
    e.preventDefault();
  } else if (e.key === "Escape") {
    document.getElementById("backBtn").click();
  }
});

renderRooms();
</script>
</body>
</html>
